<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>离线 | ZH</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/style.css?v=27" />
  <link rel="icon" type="image/png" href="images/avatar.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0e14" />
  <link rel="apple-touch-icon" href="images/avatar.png" />
  <script>try{var t=localStorage.getItem("zyf-theme");if(t==="light"||(!t&&window.matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
</head>
<body>
  <main class="container" id="mainContent" style="min-height:70vh;display:flex;align-items:center;justify-content:center;">
    <div style="text-align:center;max-width:440px;">
      <div style="font-size:56px;margin-bottom:16px;">📡</div>
      <h1 style="font-size:24px;margin-bottom:12px;">当前处于<span class="accent">离线</span>状态</h1>
      <p style="color:var(--text-dim);font-size:13.5px;line-height:1.9;margin-bottom:24px;">
        已缓存的页面仍可浏览。<br />
        恢复网络后刷新即可获取最新内容。
      </p>
      <button class="btn" id="retryBtn">🔄 重新加载</button>
      <p style="margin-top:20px;">
        <a href="index.html" style="color:var(--accent);font-size:13px;text-decoration:none;">← 返回首页</a>
      </p>
    </div>
  </main>
  <script>document.getElementById('retryBtn').addEventListener('click',function(){location.reload();});</script>
</body>
</html>
